name: iOS CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch
concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      # Restore on every run, but only save from main so PR runs don't fill the repo's cache quota
      - name: Restore Kotlin/Native (konan) cache
        id: konan-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run shared tests on iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: "**/build/reports/tests/"

      - name: Build iOS app
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/dd
          build
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64

      # Launch the app on a simulator and run the gekko UI tests shared with the Android app, so
      # runtime crashes in the Kotlin/Swift bridge fail CI
      - name: Setup gekko
        uses: jakala-germany/setup-gekko-cli-action@2aacfecac33551097b0c7b86ad57d4f59c9f5ad4 # 1.3.0
        with:
          version: 1.3.0
          ios: true

      - name: Run gekko tests
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          gekko run --project gekko --platform ios -s "$UDID" --install --record failures --output gekko-results

      - name: Collect iOS crash reports
        if: failure()
        run: |
          mkdir -p gekko-results/crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -name 'GalwayBus*' -exec cp {} gekko-results/crash-reports/ \; || true

      # Screenshots of the tests, plus video, view hierarchy and the app's crash report of failed ones
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gekko-results-ios
          path: gekko-results

      - name: Save Kotlin/Native (konan) cache
        if: github.ref == 'refs/heads/main' && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}
